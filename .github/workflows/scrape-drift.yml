# Weekly check: has ironman.guide's route drifted from the osiris-ironman data we bundle?
#
# osiris-ironman is the one NETWORK-scraped guide, so upstream edits are invisible until someone
# re-scrapes by hand. This job re-scrapes into a scratch copy, diffs against the bundled JSON, and
# opens (or updates) a single issue when they differ. It never commits — a re-scrape must go through
# the local gates (tests, fresh-account invariant, risk diff) before shipping.
name: scrape-drift

on:
  schedule:
    - cron: '23 5 * * 1'   # Mondays 05:23 UTC — off the :00 stampede
  workflow_dispatch: {}

permissions:
  issues: write
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Re-scrape into a scratch copy and diff
        id: diff
        run: |
          set -e
          cp -r src/main/resources/com/gustavguide/data/guides/osiris-ironman /tmp/bundled
          python tools/scrape_guide.py
          : > /tmp/drift-head.txt
          DRIFT=false
          if ! diff -r /tmp/bundled src/main/resources/com/gustavguide/data/guides/osiris-ironman > /tmp/drift.txt 2>&1; then
            DRIFT=true
            { echo "osiris-ironman re-scrape diff:"; head -c 5000 /tmp/drift.txt; } >> /tmp/drift-head.txt
          fi
          git checkout -- src/main/resources/com/gustavguide/data/guides/osiris-ironman
          # Wiki-sourced guides: hash upstream pages against the baseline from the last scrape.
          if ! python tools/check_wiki_drift.py > /tmp/wiki-drift.txt 2>&1; then
            DRIFT=true
            { echo; echo "wiki-sourced guide drift:"; head -c 1500 /tmp/wiki-drift.txt; } >> /tmp/drift-head.txt
          fi
          echo "drift=$DRIFT" >> "$GITHUB_OUTPUT"

      - name: Open or update the drift issue
        if: steps.diff.outputs.drift == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            // The snippet embeds scraped UPSTREAM content - neutralise backtick runs so a page
            // containing ``` cannot break out of the code fence in the issue body.
            const snippet = fs.readFileSync('/tmp/drift-head.txt', 'utf8').replace(/`{3,}/g, '~~~');
            const body = 'Weekly scrape-drift check: a bundled guide no longer matches its upstream '
              + 'source. Re-scrape locally (`py -3 tools/scrape_guide.py` for osiris, '
              + '`py -3 tools/scrape_wiki_guide.py` for a wiki guide, then re-seed with '
              + '`py -3 tools/check_wiki_drift.py --seed`), run the gates (`gradlew check` + the '
              + 'risk diff), and ship if clean.\n\n```\n'
              + snippet + '\n```';
            const title = 'A bundled guide has drifted from its upstream source';
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'scrape-drift',
            });
            if (open.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['scrape-drift'],
              });
            }
