plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'
def pluginMainClass = 'com.gustavguide.GustavGuidePluginTest'

dependencies {
	compileOnly group: 'net.runelite', name:'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation 'junit:junit:4.12'
	testImplementation group: 'net.runelite', name:'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name:'jshell', version: runeLiteVersion
	testImplementation 'org.projectlombok:lombok:1.18.30'
	testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'
	testImplementation 'org.mockito:mockito-core:3.1.0'
}

group = 'com.gustavguide'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

tasks.register('run', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass

	jvmArgs "-ea"
	args "--developer-mode", "--debug"
}

tasks.register('shadowJar', Jar) {
	dependsOn configurations.testRuntimeClasspath
	manifest {
		attributes('Main-Class': pluginMainClass, 'Multi-Release': true)
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.main.output
	from sourceSets.test.output
	from {
		configurations.testRuntimeClasspath.collect { file ->
			file.isDirectory() ? file : zipTree(file)
		}
	}

	exclude 'META-INF/INDEX.LIST'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude '**/module-info.class'

	group = BasePlugin.BUILD_GROUP
	archiveClassifier.set('shadow')
	archiveFileName.set("${rootProject.name}-${project.version}-all.jar")
}

// The route data is produced by tools/*.py, so the matcher guards that keep 6000+ steps pointing at
// the right tile are Python tests. Wire them into `check` so they cannot silently rot — a name
// matcher regressing here is invisible to the Java tests but ships wrong coordinates to every user.
// Skipped (not failed) when no Python is on PATH, so a Java-only contributor is never blocked.
tasks.register('pythonToolTests') {
	group = 'verification'
	description = 'Run the route-builder matcher tests in tools/test_*.py'
	doLast {
		def exe = ['py', 'python3', 'python'].find { candidate ->
			try {
				def p = new ProcessBuilder(candidate, '--version').redirectErrorStream(true).start()
				p.waitFor() == 0
			} catch (ignored) {
				false
			}
		}
		if (exe == null) {
			logger.lifecycle('pythonToolTests: no Python interpreter found on PATH — skipping')
			return
		}
		// check_wiki_drift.py is EXCLUDED: it fetches wiki pages over the network, which has no place
		// in a local build gate - the weekly scrape-drift Action runs it instead.
		def suites = fileTree('tools').matching {
			include 'test_*.py'; include 'check_*.py'; exclude 'check_wiki_drift.py'
		}.files.sort { it.name }
		def failed = []
		suites.each { suite ->
			def result = exec {
				commandLine exe, suite.absolutePath
				workingDir projectDir
				ignoreExitValue true
			}
			if (result.exitValue != 0) {
				failed << suite.name
			}
		}
		if (failed) {
			throw new GradleException("Python tool tests failed: ${failed.join(', ')}")
		}
		logger.lifecycle("pythonToolTests: ${suites.size()} suite(s) passed")
	}
}

tasks.named('check') { dependsOn 'pythonToolTests' }
